<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Art That Starts With Your Story — More by Shilpi</title>
<meta name="description" content="Art that starts with your story — coming soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Alex+Brush&family=Sacramento&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body data-page="inspirations">

<div id="site-header"></div>

<section class="section section--tight">
  <div class="container">
    <span class="eyebrow">Art that starts with your story</span>
    <h1>Made around you</h1>
    <p class="lede" style="max-width:60ch;">Personalised pieces, painted around the people and moments that matter to you.</p>
  </div>
</section>

<section class="section--tight">
  <div class="container">
    <div class="grid grid--4" id="storyArtGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js?v=3"></script>
<script src="js/cart.js?v=3"></script>
<script src="js/main.js?v=3"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("storyArtGrid").innerHTML = STORY_ART.map(
      (p) => `
      <a href="product.html?id=${p.id}" class="cat-card pcard">
        ${p.isNew ? '<span class="badge-new">New</span>' : ""}
        <div class="art-block ${p.art} ${p.image ? "has-img" : ""}">${p.image ? `<img src="${p.image}" alt="${p.title}" loading="lazy">` : `<span>${p.title}</span>`}</div>
        <div class="cat-body">
          <h3>${p.title}</h3>
          <p style="font-size:.85rem;">${p.medium}</p>
          <div class="price-line"><span></span><span>${money(p.price)}</span></div>
        </div>
      </a>`
    ).join("");
  });
</script>
</body>
</html>
