<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn — More by Shilpi</title>
<meta name="description" content="Short guides on choosing sizes, caring for original paintings, printing at home, and what makes a piece custom.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="learn">

<div id="site-header"></div>

<section class="section section--tight">
  <div class="container">
    <span class="eyebrow">Learn</span>
    <h1>A few short guides before you order</h1>
    <p class="lede" style="max-width:60ch;">Quick reads on sizing, care, printing and how our custom pieces actually work.</p>
  </div>
</section>

<section class="section--tight">
  <div class="container">
    <div class="grid grid--2" id="learnGrid"></div>
  </div>
</section>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("learnGrid").innerHTML = LEARN_ARTICLES.map(
      (a) => `
      <a href="${a.href || "#"}" class="cat-card" style="flex-direction:row;align-items:stretch;">
        <div class="art-block ${a.art}" style="width:150px;flex-shrink:0;aspect-ratio:auto;font-size:1.1rem;"><span>${a.title}</span></div>
        <div class="cat-body">
          <span class="pill">${a.minutes} min read</span>
          <h3>${a.title}</h3>
          <p>${a.summary}</p>
        </div>
      </a>`
    ).join("");
  });
</script>
</body>
</html>
